services:
  web:
    image: ghcr.io/nanasess/ec-cube-php:7.4-apache-4.0
    ports:
      - 1080:80
    environment:
      - APP_ENV=dev
      - APP_DEBUG=1
      - DATABASE_URL=postgresql://db/up?user=postgres&password=password
      - DATABASE_SERVER_VERSION=10.18
      - MAILER_URL=smtp://mail:1025
      - ECCUBE_TIMEZONE=Asia/Tokyo
      - ECCUBE_CURRENCY=JPY
      - ECCUBE_ADMIN_USER=admin
      - ECCUBE_ADMIN_PASS=adminAdmin
      - ECCUBE_AUTH_MAGIC=PaVBVZkYqAjCQCu6UBL2xgsnZhw
      - ECCUBE_ADMIN_ROUTE=admin
      - ECCUBE_TEMPLATE_CODE=default
      - ECCUBE_LOCALE=ja
    depends_on:
      - db
      - mail
    volumes:
      - "./UpcPaymentPlugin:/var/www/html/app/Plugin/UpcPaymentPlugin"
      - "vendor:/var/www/html/vendor"

  db:
    image: postgres:10
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - db:/var/lib/postgresql/data

  mail:
    image: mailhog/mailhog
    ports:
      - 2080:8025

volumes:
  db:
  vendor:
